# Include inside the doctor-dog.com TLS server block.
# /lihong/secure/doctor-dog-kg-headers.conf must contain only a server-side
# proxy_set_header X-API-Key directive. Never commit its real value.

location = /ai/kg/overview {
    limit_except GET { deny all; }
    include /lihong/secure/doctor-dog-kg-headers.conf;
    proxy_pass http://127.0.0.1:6000/ai/kg/overview;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 65s;
    proxy_send_timeout 30s;
    add_header Cache-Control "no-store" always;
}

